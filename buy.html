<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สั่งซื้อสินค้า — OptiGuard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: { DEFAULT: '#12172B', deep: '#0B0F1F', light: '#1D2440' },
          amber: { DEFAULT: '#E8A33D', soft: '#F2C579', dim: '#9C7233' },
          teal: { DEFAULT: '#4C6B77', light: '#7C97A0' },
          cream: '#F5F0E6',
        },
        fontFamily: { display: ['Kanit', 'sans-serif'], body: ['Sarabun', 'sans-serif'] },
      },
    },
  }
</script>
<style>
  * { font-family: 'Sarabun', sans-serif; }
  .font-display { font-family: 'Kanit', sans-serif; }
  body { background-color: #0B0F1F; }
  .btn-primary { background: #E8A33D; color: #12172B; transition: all 0.15s ease; }
  .btn-primary:hover { background: #F2C579; box-shadow: 0 8px 30px -6px rgba(232,163,61,0.5); }
  .input-field { background: rgba(18, 23, 43, 0.8); border: 1px solid rgba(124, 151, 160, 0.3); color: #F5F0E6; transition: border-color 0.2s; }
  .input-field:focus { outline: none; border-color: #E8A33D; }
</style>
</head>
<body class="bg-navy-deep text-cream min-h-screen pb-12">

  <header class="max-w-4xl mx-auto px-6 py-6 flex items-center justify-between border-b border-teal-light/20 mb-8">
    <a href="index.html" class="text-sm text-cream/60 hover:text-amber">← กลับหน้าหลัก</a>
    <span class="font-display text-xl font-semibold text-amber">OptiGuard Store</span>
  </header>

  <main class="max-w-4xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 gap-8">
    <!-- รายการสินค้าจาก Supabase -->
    <section>
      <h2 class="font-display text-xl font-semibold mb-4 text-cream">เลือกสินค้าที่ต้องการสั่งซื้อ</h2>
      <div id="productList" class="space-y-4">
        <p class="text-cream/50">กำลังโหลดรายการสินค้า...</p>
      </div>
    </section>

    <!-- ฟอร์มกรอกที่อยู่จัดส่ง -->
    <section class="bg-navy-light/40 border border-teal-light/20 rounded-2xl p-6 h-fit">
      <h2 class="font-display text-xl font-semibold mb-2 text-cream">กรอกข้อมูลจัดส่ง</h2>
      <p class="text-cream/40 text-xs mb-6">เจ้าหน้าที่จะติดต่อกลับเพื่อยืนยันคำสั่งซื้อ</p>

      <form id="orderForm" onsubmit="submitOrder(event)" class="space-y-4">
        <div>
          <label class="block text-xs text-cream/70 mb-1">เลือกสินค้า *</label>
          <select id="productSelect" required class="input-field w-full rounded-lg px-3 py-2 text-sm">
            <option value="">-- กรุณาเลือกสินค้า --</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-cream/70 mb-1">จำนวน *</label>
          <input type="number" id="orderQty" value="1" min="1" required class="input-field w-full rounded-lg px-3 py-2 text-sm">
        </div>
        <div>
          <label class="block text-xs text-cream/70 mb-1">ชื่อ-นามสกุล *</label>
          <input type="text" id="custName" placeholder="สมชาย ใจดี" required class="input-field w-full rounded-lg px-3 py-2 text-sm">
        </div>
        <div>
          <label class="block text-xs text-cream/70 mb-1">เบอร์โทรศัพท์ *</label>
          <input type="tel" id="custPhone" placeholder="0812345678" required class="input-field w-full rounded-lg px-3 py-2 text-sm">
        </div>
        <div>
          <label class="block text-xs text-cream/70 mb-1">ที่อยู่จัดส่ง *</label>
          <textarea id="custAddress" rows="3" placeholder="บ้านเลขที่ ถนน แขวง/ตำบล เขต/อำเภอ จังหวัด" required class="input-field w-full rounded-lg px-3 py-2 text-sm"></textarea>
        </div>

        <button type="submit" id="submitBtn" class="btn-primary w-full py-3 rounded-full font-display font-medium text-base mt-2">
          ยืนยันการสั่งซื้อ
        </button>
      </form>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://whhzpuqpsexnauxxxwjv.supabase.co";
    const SUPABASE_KEY = "sb_publishable_RgHmJpBmzx8OD6B5f2VQoA_5TiM9QcZ";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let products = [];

    async function loadProducts() {
      const { data, error } = await supabaseClient.from('products').select('*');
      if (error) { console.error(error); return; }
      products = data || [];
      renderProducts();
    }

    function renderProducts() {
      const container = document.getElementById('productList');
      const select = document.getElementById('productSelect');

      if (products.length === 0) {
        container.innerHTML = '<p class="text-cream/50">ไม่มีสินค้าจำหน่ายในขณะนี้</p>';
        return;
      }

      container.innerHTML = products.map(p => `
        <div class="bg-navy-light/60 border border-teal-light/20 rounded-xl p-4 flex gap-4 items-center">
          <img src="${p.image_url || 'https://via.placeholder.com/100'}" class="w-16 h-16 object-cover rounded-lg">
          <div class="flex-1">
            <h3 class="font-display font-medium text-cream">${p.name}</h3>
            <p class="text-amber font-semibold">${p.price} บาท</p>
            <p class="text-cream/40 text-xs mt-0.5">คงเหลือ: ${p.stock} ชิ้น</p>
          </div>
        </div>
      `).join('');

      select.innerHTML = '<option value="">-- กรุณาเลือกสินค้า --</option>' + 
        products.map(p => `<option value="${p.id}" ${p.stock <= 0 ? 'disabled' : ''}>${p.name} (${p.price} ฿) ${p.stock <= 0 ? '- หมด' : ''}</option>`).join('');
    }

    async function submitOrder(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'กำลังส่งข้อมูล...';

      const productId = parseInt(document.getElementById('productSelect').value);
      const qty = parseInt(document.getElementById('orderQty').value);
      const product = products.find(p => p.id === productId);

      if (!product || qty > product.stock) {
        alert('จำนวนสินค้าในสต๊อกไม่เพียงพอ');
        submitBtn.disabled = false;
        submitBtn.textContent = 'ยืนยันการสั่งซื้อ';
        return;
      }

      const orderData = {
        product_id: productId,
        quantity: qty,
        total_price: product.price * qty,
        customer_name: document.getElementById('custName').value,
        customer_phone: document.getElementById('custPhone').value,
        customer_address: document.getElementById('custAddress').value
      };

      // บันทึกลงตาราง sales
      const { error: saleError } = await supabaseClient.from('sales').insert([orderData]);

      if (saleError) {
        alert('เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
        console.error(saleError);
      } else {
        // ตัดสต๊อกสินค้า
        await supabaseClient.from('products').update({ stock: product.stock - qty }).eq('id', productId);
        alert('สั่งซื้อสำเร็จ! เจ้าหน้าที่จะติดต่อกลับโดยเร็ว');
        document.getElementById('orderForm').reset();
        loadProducts();
      }

      submitBtn.disabled = false;
      submitBtn.textContent = 'ยืนยันการสั่งซื้อ';
    }

    loadProducts();
  </script>
</body>
</html>
