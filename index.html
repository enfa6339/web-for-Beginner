<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OptiGuard — ปกป้องสายตาหน้าจอ สบายตาทุกชั่วโมงทำงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: { DEFAULT: '#12172B', deep: '#0B0F1F', light: '#1D2440' },
          amber: { DEFAULT: '#E8A33D', soft: '#F2C579', dim: '#9C7233' },
          teal: { DEFAULT: '#4C6B77', light: '#7C97A0' },
          cream: '#F5F0E6',
        },
        fontFamily: { display: ['Kanit', 'sans-serif'], body: ['Sarabun', 'sans-serif'] },
      },
    },
  }
</script>
<style>
  * { font-family: 'Sarabun', sans-serif; }
  .font-display { font-family: 'Kanit', sans-serif; }
  body { background-color: #0B0F1F; }
  .btn-primary { background: #E8A33D; color: #12172B; transition: all 0.15s ease; }
  .btn-primary:hover { background: #F2C579; box-shadow: 0 8px 30px -6px rgba(232,163,61,0.5); }
</style>
</head>
<body class="bg-navy-deep text-cream min-h-screen">

  <!-- Header -->
  <header class="max-w-7xl mx-auto px-6 py-6 flex items-center justify-between border-b border-teal-light/20">
    <div class="font-display text-2xl font-bold text-amber">OptiGuard</div>
    <div class="flex gap-4 items-center text-sm">
      <a href="buy.html" class="btn-primary px-5 py-2 rounded-full font-display font-medium">สั่งซื้อออนไลน์</a>
      <a href="pos.html" class="text-cream/60 hover:text-amber">POS หน้าร้าน</a>
    </div>
  </header>

  <!-- Hero Banner -->
  <section class="max-w-7xl mx-auto px-6 py-16 text-center">
    <h1 class="font-display text-4xl md:text-6xl font-bold text-cream mb-4">
      ปกป้องสายตาหน้าจอ <span class="text-amber">สบายตาทุกชั่วโมงทำงาน</span>
    </h1>
    <p class="text-cream/70 text-lg max-w-2xl mx-auto mb-8">
      กรองแสงสีฟ้าสูงสุด 99% น้ำหนักเบา ใส่ทำงาน เรียน หรือไถมือถือได้ทั้งวันโดยไม่ปวดตา
    </p>
  </section>

  <!-- Product Catalog (ดึงจาก Supabase) -->
  <section class="max-w-7xl mx-auto px-6 pb-20">
    <h2 class="font-display text-2xl font-semibold mb-8 text-cream text-center">สินค้าทั้งหมดของเรา</h2>
    <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <p class="text-cream/50 col-span-full text-center py-8">กำลังโหลดรายการสินค้า...</p>
    </div>
  </section>

  <script>
    const SUPABASE_URL = "https://whhzpuqpsexnauxxxwjv.supabase.co";
    const SUPABASE_KEY = "sb_publishable_RgHmJpBmzx8OD6B5f2VQoA_5TiM9QcZ";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadProducts() {
      const { data, error } = await supabaseClient.from('products').select('*');
      if (error) { console.error(error); return; }
      renderProducts(data || []);
    }

    function renderProducts(products) {
      const grid = document.getElementById('productGrid');
      if (products.length === 0) {
        grid.innerHTML = '<p class="text-cream/50 col-span-full text-center py-8">ไม่มีสินค้าจำหน่ายในขณะนี้</p>';
        return;
      }

      grid.innerHTML = products.map(p => `
        <div class="bg-navy-light/40 border border-teal-light/20 rounded-2xl p-5 flex flex-col justify-between hover:border-amber/50 transition-all">
          <div>
            <img src="${p.image_url || 'https://via.placeholder.com/300'}" class="w-full h-48 object-cover rounded-xl mb-4">
            <h3 class="font-display text-lg font-semibold text-cream mb-1">${p.name}</h3>
            <p class="text-amber font-semibold text-xl mb-2">${p.price} บาท</p>
            <p class="text-cream/40 text-xs mb-4">สถานะ: ${p.stock > 0 ? `มีสินค้าคงเหลือ ${p.stock} ชิ้น` : '<span class="text-red-400">สินค้าหมด</span>'}</p>
          </div>
          <a href="buy.html" class="btn-primary w-full py-2.5 rounded-xl font-display text-center font-medium block">
            สั่งซื้อเลย
          </a>
        </div>
      `).join('');
    }

    loadProducts();
  </script>
</body>
</html>
