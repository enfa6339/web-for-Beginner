<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — OptiGuard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: { DEFAULT: '#12172B', deep: '#0B0F1F', light: '#1D2440' },
          amber: { DEFAULT: '#E8A33D', soft: '#F2C579', dim: '#9C7233' },
          teal: { DEFAULT: '#4C6B77', light: '#7C97A0' },
          cream: '#F5F0E6',
        },
        fontFamily: { display: ['Kanit', 'sans-serif'], body: ['Sarabun', 'sans-serif'] },
      },
    },
  }
</script>
<style>
  * { font-family: 'Sarabun', sans-serif; }
  .font-display { font-family: 'Kanit', sans-serif; }
  body { background-color: #0B0F1F; }
  .btn-primary { background: #E8A33D; color: #12172B; transition: all 0.15s ease; }
  .btn-primary:hover { background: #F2C579; }
</style>
</head>
<body class="bg-navy-deep text-cream min-h-screen pb-12">

  <header class="max-w-7xl mx-auto px-6 py-6 flex items-center justify-between border-b border-teal-light/20 mb-8">
    <div class="flex items-center gap-3">
      <span class="font-display text-2xl font-bold text-amber">OptiGuard</span>
      <span class="text-xs bg-amber/20 text-amber px-2.5 py-1 rounded-full border border-amber/30">Admin Dashboard</span>
    </div>
    <a href="index.html" class="text-sm text-cream/60 hover:text-amber">← กลับหน้าสินค้า</a>
  </header>

  <main class="max-w-7xl mx-auto px-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="font-display text-2xl font-semibold text-cream">รายการสั่งซื้อสินค้าทั้งหมด</h1>
      <button onclick="loadOrders()" class="btn-primary px-4 py-2 rounded-lg text-sm font-medium">
        ↻ รีเฟรชข้อมูล
      </button>
    </div>

    <!-- ตารางแสดงผล -->
    <div class="bg-navy-light/40 border border-teal-light/20 rounded-2xl overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-navy-light text-amber font-display border-b border-teal-light/20">
            <tr>
              <th class="p-4">วัน-เวลา</th>
              <th class="p-4">สินค้า</th>
              <th class="p-4 text-center">จำนวน</th>
              <th class="p-4 text-right">ยอดรวม</th>
              <th class="p-4">ชื่อลูกค้า</th>
              <th class="p-4">เบอร์โทร</th>
              <th class="p-4">ที่อยู่จัดส่ง</th>
              <th class="p-4 text-center">จัดการ</th>
            </tr>
          </thead>
          <tbody id="orderTableBody" class="divide-y divide-teal-light/10 text-cream/80">
            <tr>
              <td colspan="8" class="p-8 text-center text-cream/40">กำลังโหลดรายการสั่งซื้อ...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://whhzpuqpsexnauxxxwjv.supabase.co";
    const SUPABASE_KEY = "sb_publishable_RgHmJpBmzx8OD6B5f2VQoA_5TiM9QcZ";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    // ใส่ Web App URL ของ Google Script ของคุณแล้ว
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbxzubfCkVhK7-pnK2bwUpJU_lxd0zfemP2i1KsGM9AWiUmlsNAEXdkTJkE2lq2FA4I9-A/exec"; 

    async function loadOrders() {
      const { data: sales, error } = await supabaseClient
        .from('sales')
        .select('*, products(name)')
        .order('created_at', { ascending: false });

      if (error) { console.error(error); return; }
      renderTable(sales || []);
    }

    function renderTable(sales) {
      const tbody = document.getElementById('orderTableBody');
      if (sales.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="p-8 text-center text-cream/40">ยังไม่มีรายการสั่งซื้อ</td></tr>';
        return;
      }

      tbody.innerHTML = sales.map(s => {
        const date = new Date(s.created_at).toLocaleString('th-TH');
        const pName = s.products ? s.products.name : 'สินค้าทั่วไป';
        return `
          <tr class="hover:bg-navy-light/20">
            <td class="p-4 text-xs text-cream/50">${date}</td>
            <td class="p-4 font-medium text-cream">${pName}</td>
            <td class="p-4 text-center">${s.quantity}</td>
            <td class="p-4 text-right text-amber font-semibold">${s.total_price} ฿</td>
            <td class="p-4">${s.customer_name || '<span class="text-cream/30">หน้าร้าน (POS)</span>'}</td>
            <td class="p-4">${s.customer_phone || '-'}</td>
            <td class="p-4 text-xs max-w-xs truncate">${s.customer_address || '-'}</td>
            <td class="p-4 text-center">
              <button onclick='syncToSheet(${JSON.stringify({
                product_name: pName,
                quantity: s.quantity,
                total_price: s.total_price,
                customer_name: s.customer_name,
                customer_phone: s.customer_phone,
                customer_address: s.customer_address
              })})' class="text-xs bg-teal/40 hover:bg-teal text-cream px-3 py-1.5 rounded-md border border-teal-light/30">
                ส่งเข้า Sheet
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function syncToSheet(order) {
      try {
        await fetch(GOOGLE_SHEET_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(order)
        });
        alert("ส่งข้อมูลเข้า Google Sheet เรียบร้อยแล้ว!");
      } catch (err) {
        alert("เกิดข้อผิดพลาดในการส่งข้อมูล");
        console.error(err);
      }
    }

    loadOrders();
  </script>
</body>
</html>
